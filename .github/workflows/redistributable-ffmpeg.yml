name: Redistributable FFmpeg

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redistributable-ffmpeg
  cancel-in-progress: false

jobs:
  build:
    name: LGPL shared Windows build without OpenH264
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      BTBN_COMMIT: 2a3249ec58228c661e7ff8fdc9ea997b18aa912b
      FFMPEG_COMMIT: 8c9502e9b048e21e1cae96477e338ac0635645ba
      BASE_IMAGE_DIGEST: ghcr.io/btbn/ffmpeg-builds/base@sha256:bda8a0c319d4c2117ed29af1e37b46c88b5788d6f4e2ef175abbcb02af35ad6b
      DEPENDENCY_IMAGE_DIGEST: ghcr.io/btbn/ffmpeg-builds/win64-lgpl-shared-8.1@sha256:c07cde1a8bbcef7cd6f932e6bc1eca08d1849a9b23102c96713ee1c70b22717a
    steps:
      - name: Check out release engineering source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reclaim runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/local/lib/android
          docker system prune --all --force
          df -h

      - name: Check out the pinned FFmpeg build system
        shell: bash
        run: |
          set -euo pipefail
          git init ffmpeg-builds
          git -C ffmpeg-builds remote add origin https://github.com/BtbN/FFmpeg-Builds.git
          git -C ffmpeg-builds fetch --depth=1 origin "${BTBN_COMMIT}"
          git -C ffmpeg-builds checkout --detach FETCH_HEAD
          test "$(git -C ffmpeg-builds rev-parse HEAD)" = "${BTBN_COMMIT}"

      - name: Exclude OpenH264 and pin the FFmpeg source commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          openh264 = Path("ffmpeg-builds/scripts.d/50-openh264.sh")
          source = openh264.read_text(encoding="utf-8")
          expected = "ffbuild_enabled() {\n    return 0\n}"
          if source.count(expected) != 1:
              raise SystemExit("Pinned OpenH264 enable seam changed")
          openh264.write_text(
              source.replace(expected, "ffbuild_enabled() {\n    return 1\n}"),
              encoding="utf-8",
          )
          source = openh264.read_text(encoding="utf-8")
          expected = "ffbuild_enabled() {\n    return 1\n}\n\nffbuild_dockerbuild()"
          replacement = (
              "ffbuild_enabled() {\n    return 1\n}\n\n"
              "ffbuild_dockerdl() {\n    return 0\n}\n\n"
              "ffbuild_dockerbuild()"
          )
          if source.count(expected) != 1:
              raise SystemExit("Pinned OpenH264 download seam changed")
          openh264.write_text(source.replace(expected, replacement), encoding="utf-8")

          opus = Path("ffmpeg-builds/scripts.d/50-libopus.sh")
          source = opus.read_text(encoding="utf-8")
          expected = "ffbuild_enabled() {\n    return 0\n}"
          if source.count(expected) != 1:
              raise SystemExit("Pinned libopus enable seam changed")
          opus.write_text(
              source.replace(expected, "ffbuild_enabled() {\n    return 1\n}"),
              encoding="utf-8",
          )
          source = opus.read_text(encoding="utf-8")
          expected = (
              "ffbuild_dockerdl() {\n"
              "    default_dl .\n\n"
              "    # This is where they decided to put downloads for external dependencies, so it needs to run here\n"
              "    echo \"./autogen.sh\"\n"
              "}"
          )
          replacement = "ffbuild_dockerdl() {\n    return 0\n}"
          if source.count(expected) != 1:
              raise SystemExit("Pinned libopus download seam changed")
          opus.write_text(source.replace(expected, replacement), encoding="utf-8")

          build = Path("ffmpeg-builds/build.sh")
          source = build.read_text(encoding="utf-8")
          expected = "    cd ffmpeg\n\n    ./configure"
          replacement = (
              "    cd ffmpeg\n"
              "    git checkout \"$FFMPEG_COMMIT\"\n"
              "    test \"\\$(git rev-parse HEAD)\" = \"$FFMPEG_COMMIT\"\n\n"
              "    FF_CONFIGURE=\"\\${FF_CONFIGURE/--enable-libopenh264/--disable-libopenh264}\"\n"
              "    FF_CONFIGURE=\"\\${FF_CONFIGURE/--enable-libopus/--disable-libopus}\"\n\n"
              "    ./configure"
          )
          if source.count(expected) != 1:
              raise SystemExit("Pinned FFmpeg checkout seam changed")
          build.write_text(source.replace(expected, replacement), encoding="utf-8")

          variables = Path("ffmpeg-builds/util/vars.sh")
          source = variables.read_text(encoding="utf-8")
          expected = 'BASE_IMAGE="${REGISTRY}/${REPO}/base:latest"'
          replacement = f'BASE_IMAGE="{os.environ["BASE_IMAGE_DIGEST"]}"'
          if source.count(expected) != 1:
              raise SystemExit("Pinned base-image seam changed")
          source = source.replace(expected, replacement)
          expected = 'IMAGE="${REGISTRY}/${REPO}/${TARGET}-${VARIANT}${ADDINS_STR:+-}${ADDINS_STR}:latest"'
          replacement = f'IMAGE="{os.environ["DEPENDENCY_IMAGE_DIGEST"]}"'
          if source.count(expected) != 1:
              raise SystemExit("Pinned dependency-image seam changed")
          variables.write_text(source.replace(expected, replacement), encoding="utf-8")

          download = Path("ffmpeg-builds/download.sh")
          source = download.read_text(encoding="utf-8")
          expected = '"${REGISTRY}/${REPO}/base:latest${DOCKER_TAG_SUFFIX:-}" \\\n'
          replacement = '"${BASE_IMAGE}" \\\n'
          if source.count(expected) != 1:
              raise SystemExit("Pinned source-download invocation seam changed")
          download.write_text(source.replace(expected, replacement), encoding="utf-8")

          PY
          git -C ffmpeg-builds diff --check
          git -C ffmpeg-builds diff -- scripts.d/50-openh264.sh scripts.d/50-libopus.sh build.sh download.sh util/vars.sh

      - name: Restore matching dependency-source cache
        id: dependency-sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ffmpeg-builds/.cache/downloads
          key: replayfoundry-ffmpeg-sources-${{ env.BTBN_COMMIT }}-no-openh264-no-libopus-v1

      - name: Download matching dependency sources
        working-directory: ffmpeg-builds
        shell: bash
        run: |
          set -euo pipefail
          ./download.sh 2>&1 | tee ../dependency-download.log

      - name: Save matching dependency sources
        if: steps.dependency-sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ffmpeg-builds/.cache/downloads
          key: replayfoundry-ffmpeg-sources-${{ env.BTBN_COMMIT }}-no-openh264-no-libopus-v1

      - name: Build FFmpeg
        working-directory: ffmpeg-builds
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh win64 lgpl-shared 8.1 2>&1 | tee ../ffmpeg-build.log

      - name: Verify the redistributable codec boundary
        shell: bash
        run: |
          set -euo pipefail
          effective_configure="$(grep -F '+ ./configure ' ffmpeg-build.log)"
          test -n "${effective_configure}"
          grep -- '--disable-libopenh264' <<< "${effective_configure}"
          grep -- '--disable-libopus' <<< "${effective_configure}"
          if grep -E -- '--enable-(libopenh264|libopus|gpl|nonfree)' <<< "${effective_configure}"; then
            echo 'A forbidden external codec, GPL, or nonfree option remained enabled.' >&2
            exit 1
          fi
          binary="$(find ffmpeg-builds/artifacts -maxdepth 1 -type f -name '*win64-lgpl-shared-8.1.zip' -print -quit)"
          test -n "${binary}"
          mkdir verified-binary
          unzip -q "${binary}" -d verified-binary
          mapfile -t binary_payloads < <(
            find verified-binary -type f \( -name '*.exe' -o -name '*.dll' \) -print
          )
          test "${#binary_payloads[@]}" -gt 0
          if grep -a -i -l -E -- '--enable-(libopenh264|libopus)' "${binary_payloads[@]}"; then
            echo 'A forbidden external-codec enable flag remained in the executable payload.' >&2
            exit 1
          fi
          for payload in "${binary_payloads[@]}"; do
            if objdump -p "${payload}" | grep -Eiq 'DLL Name:.*(openh264|opus)'; then
              echo "A forbidden external codec is linked by ${payload}." >&2
              exit 1
            fi
          done
          if ! grep -a -q 'h264_mf' verified-binary/*/bin/avcodec-*.dll; then
            echo 'The Windows Media Foundation H.264 encoder is missing.' >&2
            exit 1
          fi
          test -f verified-binary/*/bin/ffmpeg.exe
          test -f verified-binary/*/bin/ffprobe.exe
          test -f verified-binary/*/LICENSE.txt
          sha256sum "${binary}" | tee ffmpeg-binary.sha256
          printf '%s\n' "${binary}" > ffmpeg-binary.path

      - name: Upload FFmpeg binary candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replayfoundry-ffmpeg-win64-lgpl-shared
          path: |
            ffmpeg-builds/artifacts/*.zip
            ffmpeg-binary.sha256
            ffmpeg-build.log
          if-no-files-found: error
          retention-days: 14

      - name: Assemble corresponding source and build evidence
        shell: bash
        run: |
          set -euo pipefail
          source_root="corresponding-source"
          mkdir -p "${source_root}/archives" "${source_root}/evidence"

          git -C ffmpeg-builds archive --format=tar --prefix=FFmpeg-Builds/ HEAD \
            | xz -T0 -9e > "${source_root}/archives/FFmpeg-Builds-${BTBN_COMMIT}.tar.xz"
          curl --fail --location --retry 3 \
            "https://codeload.github.com/FFmpeg/FFmpeg/tar.gz/${FFMPEG_COMMIT}" \
            --output "${source_root}/archives/FFmpeg-${FFMPEG_COMMIT}.tar.gz"
          cp -a ffmpeg-builds/.cache/downloads "${source_root}/dependency-sources"
          cp dependency-download.log ffmpeg-build.log ffmpeg-binary.sha256 \
            "${source_root}/evidence/"
          git -C ffmpeg-builds diff --binary -- scripts.d/50-openh264.sh scripts.d/50-libopus.sh build.sh download.sh util/vars.sh \
            > "${source_root}/evidence/replayfoundry-build-changes.diff"
          printf '%s\n' \
            'ReplayFoundry redistributable FFmpeg source bundle' \
            "FFmpeg commit: ${FFMPEG_COMMIT}" \
            "FFmpeg-Builds commit: ${BTBN_COMMIT}" \
            "Pinned source-download image: ${BASE_IMAGE_DIGEST}" \
            "Pinned LGPL dependency image: ${DEPENDENCY_IMAGE_DIGEST}" \
            'Target: win64 lgpl-shared 8.1' \
            'OpenH264: disabled in FFmpeg, not linked, and not redistributed' \
            'External libopus: disabled; FFmpeg native Opus decoding remains available' \
            'The dependency-sources directory is the exact source cache consumed by the pinned build system.' \
            > "${source_root}/README.txt"
          find "${source_root}" -type f ! -path "${source_root}/SHA256SUMS" -print0 \
            | sort -z | xargs -0 sha256sum \
            > "${source_root}/SHA256SUMS"
          tar --zstd -cf replayfoundry-ffmpeg-corresponding-source.tar.zst "${source_root}"
          sha256sum replayfoundry-ffmpeg-corresponding-source.tar.zst \
            > replayfoundry-ffmpeg-corresponding-source.tar.zst.sha256

      - name: Upload corresponding source candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replayfoundry-ffmpeg-corresponding-source
          path: |
            replayfoundry-ffmpeg-corresponding-source.tar.zst
            replayfoundry-ffmpeg-corresponding-source.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
