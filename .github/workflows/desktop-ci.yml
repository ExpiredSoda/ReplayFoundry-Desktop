name: Desktop source gate

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Install Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress --yes

      - name: Install audio test dependency
        run: python -m pip install --only-binary=:all: numpy==2.5.3

      - name: Verify complete repository
        shell: pwsh
        run: >-
          .\eng\ReplayFoundry.ps1 verify
          -Configuration Release
          -PythonExecutable (Get-Command python).Source

      - name: Verify exported production snapshot
        if: ${{ hashFiles('.replayfoundry-public-source') == '' }}
        shell: pwsh
        run: |
          $publicSource = Join-Path $env:RUNNER_TEMP 'ReplayFoundry-public-source'
          .\eng\ReplayFoundry.ps1 export -Destination $publicSource
          git -C $publicSource init
          git -C $publicSource add --all
          git -C $publicSource -c user.name='Replay Foundry CI' -c user.email='ci@replayfoundry.invalid' commit -m 'Public export smoke'
          & (Join-Path $publicSource 'eng\ReplayFoundry.ps1') verify `
            -Configuration Release `
            -PythonExecutable (Get-Command python).Source
